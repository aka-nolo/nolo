name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # /showreel = the same page in "platform mode" (no contact links), for Upwork, Fiverr and Workana.
      - name: Build /showreel
        run: |
          mkdir -p public/showreel
          sed -e 's#<head>#<head>\n  <base href="/" />\n  <meta name="robots" content="noindex" />#' public/index.html > public/showreel/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
